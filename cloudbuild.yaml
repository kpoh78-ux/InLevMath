# ==============================================================================
# Google Cloud Build & Cloud Run Pipeline
# ==============================================================================
# GitHub에 push되면 자동으로 실행되어 Docker 이미지를 빌드하고 Cloud Run에 배포합니다.
# ==============================================================================

steps:
  # 1. Docker 이미지 빌드 (캐시 활용)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/inlevmath-web:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/inlevmath-web:latest'
      - '.'

  # 2. 이미지 푸시
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/inlevmath-web:$SHORT_SHA'

  # 3. Google Cloud Run 자동 배포
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'inlevmath-web'
      - '--image'
      - 'gcr.io/$PROJECT_ID/inlevmath-web:$SHORT_SHA'
      - '--region'
      - 'asia-northeast3' # 서울 리전 (원하시는 리전으로 변경 가능)
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated' # 외부(스마트폰/모바일)에서 바로 접속 허용
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0' # 사용하지 않을 때는 0개로 축소하여 비용 절감 (Free Tier 친화적)

images:
  - 'gcr.io/$PROJECT_ID/inlevmath-web:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/inlevmath-web:latest'

options:
  logging: CLOUD_LOGGING_ONLY
